<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Food Controll</title>
  <meta name="description" content="Behalte den Überblick über Kühlschrank und Einkaufsliste." />

  <!-- PWA: Name, Farbe und Icon für "Zum Home-Bildschirm hinzufügen" -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1E3F66" />

  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  />

      margin: 0;

    }

      min-height: 100vh;
    }
  </style>

  <!-- React 18 (UMD) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone: übersetzt das untenstehende JSX direkt im Browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

/* ---------- Speicher (localStorage statt Claude-Artefakt-Storage) ---------- */
const storage = {
  async get(key) {
    const value = window.localStorage.getItem(key);
    if (value === null) {
      throw new Error("Kein Wert für Schlüssel: " + key);
    }
    return { key, value };
  },
  async set(key, value) {
    window.localStorage.setItem(key, value);
    return { key, value };
  },
};

/* ---------- Icons (einfache SVGs als Ersatz für lucide-react) ---------- */

function Icon({ children, size = 20, strokeWidth = 2, color = "currentColor", style }) {
  return (
    <svg
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke={color}
      strokeWidth={strokeWidth}
      strokeLinecap="round"
      strokeLinejoin="round"
      style={style}
    >
      {children}
    </svg>
  );
}

function Plus(p) {
  return (
    <Icon {...p}>
      <line x1="12" y1="5" x2="12" y2="19" />
      <line x1="5" y1="12" x2="19" y2="12" />
    </Icon>
  );
}

function Trash2(p) {
  return (
    <Icon {...p}>
      <path d="M3 6h18" />
      <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
      <line x1="10" y1="11" x2="10" y2="17" />
      <line x1="14" y1="11" x2="14" y2="17" />
    </Icon>
  );
}

function ArrowRight(p) {
  return (
    <Icon {...p}>
      <line x1="5" y1="12" x2="19" y2="12" />
      <polyline points="12 5 19 12 12 19" />
    </Icon>
  );
}

function ArrowLeft(p) {
  return (
    <Icon {...p}>
      <line x1="19" y1="12" x2="5" y2="12" />
      <polyline points="12 19 5 12 12 5" />
    </Icon>
  );
}

function Check(p) {
  return (
    <Icon {...p}>
      <polyline points="20 6 9 17 4 12" />
    </Icon>
  );
}

function ChevronDown(p) {
  return (
    <Icon {...p}>
      <polyline points="6 9 12 15 18 9" />
    </Icon>
  );
}

function Printer(p) {
  return (
    <Icon {...p}>
      <polyline points="6 9 6 2 18 2 18 9" />
      <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
      <rect x="6" y="14" width="12" height="8" />
    </Icon>
  );
}

function Share2(p) {
  return (
    <Icon {...p}>
      <circle cx="18" cy="5" r="3" />
      <circle cx="6" cy="12" r="3" />
      <circle cx="18" cy="19" r="3" />
      <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
      <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
    </Icon>
  );
}

function ListPlus(p) {
  return (
    <Icon {...p}>
      <line x1="8" y1="6" x2="21" y2="6" />
      <line x1="8" y1="12" x2="21" y2="12" />
      <line x1="8" y1="18" x2="15" y2="18" />
      <line x1="3" y1="6" x2="3.01" y2="6" />
      <line x1="3" y1="12" x2="3.01" y2="12" />
      <line x1="17" y1="17" x2="17" y2="21" />
      <line x1="15" y1="19" x2="19" y2="19" />
    </Icon>
  );
}

function NotebookPen(p) {
  return (
    <Icon {...p}>
      <path d="M12 20h9" />
      <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z" />
    </Icon>
  );
}

/* ---------- Kategorien ---------- */

const CATEGORY_OPTIONS = [
  { value: "kuehlschrank", icon: "❄️", text: "Kühlschrank" },
  { value: "obst_gemuese", icon: "🍎", text: "Obst & Gemüse" },
  { value: "schokolade_snacks", icon: "🍫", text: "Schokolade & Snacks" },
  { value: "teigwaren_sonstiges", icon: "🥫", text: "Teigwaren & sonstiges" },
  { value: "hygiene_putzmittel", icon: "🧻", text: "Hygiene- & Putzmittel" },
  { value: "tiere", icon: "🐶", text: "Tiere" },
];

const OTHER_CATEGORIES = CATEGORY_OPTIONS.filter(
  (c) => c.value !== "kuehlschrank"
);

/* ---------- Hilfsfunktionen ---------- */

const todayISO = () => new Date().toISOString().slice(0, 10);

function daysSince(dateStr) {
  if (!dateStr) return null;
  const opened = new Date(dateStr + "T00:00:00");
  const now = new Date(todayISO() + "T00:00:00");
  const diffMs = now - opened;
  return Math.floor(diffMs / (1000 * 60 * 60 * 24));
}

// grün: leer oder < 14 Tage seit Öffnung
// gelb: 14–20 Tage seit Öffnung
// rot: ab 21 Tage seit Öffnung
function urgencyColor(oeffnungsdatum) {
  const d = daysSince(oeffnungsdatum);
  if (d === null || d < 14) return { color: "var(--dot-green)", label: "frisch" };
  if (d < 21) return { color: "var(--dot-yellow)", label: "bald verbrauchen" };
  return { color: "var(--dot-red)", label: "verbrauchen!" };
}

// Sortierrang: rot (0) vor gelb (1) vor grün (2)
function urgencyRank(oeffnungsdatum) {
  const { color } = urgencyColor(oeffnungsdatum);
  if (color === "var(--dot-red)") return 0;
  if (color === "var(--dot-yellow)") return 1;
  return 2;
}

function sortByUrgency(items) {
  return [...items].sort(
    (a, b) => urgencyRank(a.oeffnungsdatum) - urgencyRank(b.oeffnungsdatum)
  );
}

function formatDate(d) {
  if (!d) return "";
  const [y, m, day] = d.split("-");
  return `${day}.${m}.${y}`;
}

function newProduct() {
  return {
    id: `p_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
    name: "",
    kaufdatum: "",
    mhd: "",
    oeffnungsdatum: "",
    category: "kuehlschrank",
    nameCommitted: false,
  };
}

function newShoppingItem(name = "") {
  return {
    id: `s_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
    name,
    checked: false,
    remembered: false,
  };
}

const STORAGE_KEY_PRODUCTS = "fridge:products";
const STORAGE_KEY_SHOPPING = "fridge:shopping";

/* ---------- Marke ---------- */

function Brand() {
  return (
    <div style={styles.brandRow}>
      <span style={styles.logo}>FC</span>
      <span style={styles.brandName}>Food Controll</span>
    </div>
  );
}

/* ---------- Hauptkomponente ---------- */

function FridgeApp() {
  const [view, setView] = useState("fridge"); // "fridge" | "shopping"
  const [products, setProducts] = useState([]);
  const [shopping, setShopping] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [newShopName, setNewShopName] = useState("");

  /* Laden beim Start */
  useEffect(() => {
    (async () => {
      try {
        const p = await storage.get(STORAGE_KEY_PRODUCTS);
        const parsed = p ? JSON.parse(p.value) : [newProduct()];
        setProducts(
          parsed.map((item) => ({
            category: "kuehlschrank",
            nameCommitted: !!(item.name && item.name.trim()),
            ...item,
          }))
        );
      } catch {
        setProducts([newProduct()]);
      }
      try {
        const s = await storage.get(STORAGE_KEY_SHOPPING);
        const parsedShopping = s ? JSON.parse(s.value) : [];
        setShopping(
          parsedShopping.map((item) => ({
            remembered: item.checked === true,
            ...item,
            checked: false,
          }))
        );
      } catch {
        setShopping([]);
      }
      setLoaded(true);
    })();
  }, []);

  const updateProduct = (id, field, value, shouldSave = false) => {
    setProducts((prev) => {
      const next = prev.map((p) =>
        p.id === id ? { ...p, [field]: value } : p
      );
      if (shouldSave) {
        storage
          .set(STORAGE_KEY_PRODUCTS, JSON.stringify(next))
          .catch(() => {
            /* im Hintergrund fehlgeschlagen, Eingabe bleibt erhalten */
          });
      }
      return next;
    });
  };

  const addProduct = () => {
    setProducts((prev) => [...prev, newProduct()]);
  };

  const removeProduct = (id) => {
    const removed = products.find((p) => p.id === id);
    setProducts((prev) => prev.filter((p) => p.id !== id));
    if (removed && removed.name.trim()) {
      persistShopping([...shopping, newShoppingItem(removed.name.trim())]);
    }
  };

  const saveProducts = useCallback(async () => {
    try {
      await storage.set(STORAGE_KEY_PRODUCTS, JSON.stringify(products));
    } catch {
      /* im Hintergrund fehlgeschlagen, Eingabe bleibt sichtbar erhalten */
    }
  }, [products]);

  const persistShopping = async (next) => {
    setShopping(next);
    try {
      await storage.set(STORAGE_KEY_SHOPPING, JSON.stringify(next));
    } catch {
      /* still shown, just not persisted */
    }
  };

  const addShoppingItem = (name) => {
    const trimmed = name.trim();
    if (!trimmed) return;
    persistShopping([...shopping, newShoppingItem(trimmed)]);
    setNewShopName("");
  };

  const toggleShoppingItem = (id) => {
    persistShopping(
      shopping.map((s) => {
        if (s.id !== id) return s;
        if (!s.remembered) {
          // Von der Einkaufsliste abgehakt -> in die Merkliste verschieben,
          // Haken direkt wieder entfernen.
          return { ...s, remembered: true, checked: false };
        }
        // In der Merkliste angeklickt -> zurück in die offene Einkaufsliste.
        return { ...s, remembered: false, checked: false };
      })
    );
  };

  const removeShoppingItem = (id) => {
    persistShopping(shopping.filter((s) => s.id !== id));
  };

  const renameShoppingItem = (id, name) => {
    const trimmed = (name || "").trim();
    if (!trimmed) return;
    persistShopping(
      shopping.map((s) => (s.id === id ? { ...s, name: trimmed } : s))
    );
  };

  const addToFridgeList = async (id, name) => {
    const trimmed = (name || "").trim();
    if (!trimmed) return;
    const nextProducts = [
      ...products,
      { ...newProduct(), name: trimmed, nameCommitted: true },
    ];
    setProducts(nextProducts);
    try {
      await storage.set(
        STORAGE_KEY_PRODUCTS,
        JSON.stringify(nextProducts)
      );
    } catch {
      /* im Hintergrund fehlgeschlagen, Eingabe bleibt sichtbar erhalten */
    }
    persistShopping(shopping.filter((s) => s.id !== id));
  };

  const saveAll = useCallback(async () => {
    try {
      await Promise.all([
        storage.set(STORAGE_KEY_PRODUCTS, JSON.stringify(products)),
        storage.set(STORAGE_KEY_SHOPPING, JSON.stringify(shopping)),
      ]);
    } catch {
      /* im Hintergrund fehlgeschlagen, Eingabe bleibt sichtbar erhalten */
    }
  }, [products, shopping]);

  const goToShopping = () => {
    saveAll();
    setView("shopping");
  };

  const goToFridge = () => {
    saveAll();
    setView("fridge");
  };

  if (!loaded) {
    return (
      <div style={styles.appShell}>
        <FontStyles />
        <div style={{ padding: "48px 24px", color: "var(--text-secondary)" }}>
          Kühlschrank wird geladen …
        </div>
      </div>
    );
  }

  return (
    <div style={styles.appShell}>
      <FontStyles />
      {view === "fridge" ? (
        <FridgeView
          products={products}
          updateProduct={updateProduct}
          addProduct={addProduct}
          removeProduct={removeProduct}
          onSave={saveProducts}
          onGoShopping={goToShopping}
        />
      ) : (
        <ShoppingView
          shopping={shopping}
          onBack={goToFridge}
          onAdd={addShoppingItem}
          onToggle={toggleShoppingItem}
          onRemove={removeShoppingItem}
          onRename={renameShoppingItem}
          onAddToFridge={addToFridgeList}
          newShopName={newShopName}
          setNewShopName={setNewShopName}
        />
      )}

      <div style={styles.creditBadge}>
        <span style={styles.creditMadeBy}>made by</span>{" "}
        <span style={styles.creditName}>PATTY</span>
      </div>
    </div>
  );
}

/* ---------- Startseite: Kühlschrank ---------- */

function FridgeView({
  products,
  updateProduct,
  addProduct,
  removeProduct,
  onSave,
  onGoShopping,
}) {
  const today = new Date();
  const dateLabel = today.toLocaleDateString("de-DE", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
  });

  const isUrgent = (p) => urgencyColor(p.oeffnungsdatum).color === "var(--dot-red)";
  const isNewEntry = (p) => !p.nameCommitted;

  const newEntries = products.filter(isNewEntry);
  const primaryProducts = sortByUrgency(
    products.filter(
      (p) =>
        !isNewEntry(p) &&
        (p.category || "kuehlschrank") === "kuehlschrank" &&
        !isUrgent(p)
    )
  );
  const otherProducts = products.filter(
    (p) =>
      !isNewEntry(p) &&
      (p.category || "kuehlschrank") !== "kuehlschrank" &&
      !isUrgent(p)
  );
  const urgentProducts = products.filter((p) => !isNewEntry(p) && isUrgent(p));

  return (
    <div style={styles.page}>
      <div style={styles.topRow}>
        <Brand />
        <button style={styles.shoppingButton} onClick={onGoShopping} type="button">
          Einkaufsliste
          <ArrowRight size={16} strokeWidth={2.4} />
        </button>
      </div>

      <button style={styles.addButton} onClick={addProduct} type="button">
        <Plus size={17} strokeWidth={2.4} />
        Produkt hinzufügen
      </button>

      {newEntries.length > 0 && (
        <ul style={styles.list}>
          {newEntries.map((p) => (
            <ProductRow
              key={p.id}
              product={p}
              onChange={(field, value, shouldSave) =>
                updateProduct(p.id, field, value, shouldSave)
              }
              onRemove={() => removeProduct(p.id)}
              onSave={onSave}
            />
          ))}
        </ul>
      )}

      {newEntries.length > 0 && (
        <>
          <br />
          <br />
        </>
      )}

      {urgentProducts.length > 0 && (
        <>
          <h3 style={styles.categoryGroupTitle}>
            <span
              aria-hidden="true"
              style={{ ...styles.dot, backgroundColor: "var(--dot-red)", display: "inline-block", marginRight: 6, verticalAlign: "middle" }}
            />
            Dringend verbrauchen
          </h3>
          <ul style={styles.list}>
            {urgentProducts.map((p) => (
              <ProductRow
                key={p.id}
                product={p}
                onChange={(field, value, shouldSave) =>
                  updateProduct(p.id, field, value, shouldSave)
                }
                onRemove={() => removeProduct(p.id)}
                onSave={onSave}
              />
            ))}
          </ul>
        </>
      )}

      {urgentProducts.length > 0 && primaryProducts.length > 0 && (
        <>
          <br />
          <br />
        </>
      )}

      {primaryProducts.length > 0 && (
        <>
          <h3 style={styles.categoryGroupTitle}>
            {CATEGORY_OPTIONS[0].icon} {CATEGORY_OPTIONS[0].text}
          </h3>
          <ul style={styles.list}>
            {primaryProducts.map((p) => (
              <ProductRow
                key={p.id}
                product={p}
                onChange={(field, value, shouldSave) =>
                  updateProduct(p.id, field, value, shouldSave)
                }
                onRemove={() => removeProduct(p.id)}
                onSave={onSave}
              />
            ))}
          </ul>
        </>
      )}

      <CategorizedList
        products={otherProducts}
        onChange={updateProduct}
        onRemove={removeProduct}
        onSave={onSave}
      />

      <div style={styles.bottomLeftRow}>
        <span style={styles.dateBadge}>{dateLabel}</span>
      </div>
    </div>
  );
}

function CategorizedList({ products, onChange, onRemove, onSave }) {
  const groups = OTHER_CATEGORIES.map((cat) => ({
    ...cat,
    items: sortByUrgency(products.filter((p) => p.category === cat.value)),
  })).filter((g) => g.items.length > 0);

  return (
    <>
      {groups.map((g) => (
        <div key={g.value} style={styles.categoryGroup}>
          <h3 style={styles.categoryGroupTitle}>
            {g.icon} {g.text}
          </h3>
          <ul style={styles.list}>
            {g.items.map((p) => (
              <ProductRow
                key={p.id}
                product={p}
                onChange={(field, value, shouldSave) =>
                  onChange(p.id, field, value, shouldSave)
                }
                onRemove={() => onRemove(p.id)}
                onSave={onSave}
              />
            ))}
          </ul>
        </div>
      ))}
    </>
  );
}

function ProductRow({ product, onChange, onRemove, onSave }) {
  const { color, label } = urgencyColor(product.oeffnungsdatum);

  const handleRowBlur = (e) => {
    // Nur reagieren, wenn der Fokus den gesamten Produktblock verlässt
    // (nicht bei einem Wechsel zwischen Feldern innerhalb derselben Zeile).
    if (e.currentTarget.contains(e.relatedTarget)) return;

    if (!product.nameCommitted && product.name.trim()) {
      onChange("nameCommitted", true, true);
    } else {
      onSave && onSave();
    }
  };

  return (
    <li style={styles.row} onBlur={handleRowBlur}>
      <div style={styles.rowTop}>
        <span
          title={label}
          aria-label={`Dringlichkeit: ${label}`}
          style={{ ...styles.dot, backgroundColor: color }}
        />
        <input
          style={styles.nameInput}
          type="text"
          placeholder="Produktname"
          value={product.name}
          onChange={(e) => onChange("name", e.target.value)}
        />
        <CategoryDropdown
          value={product.category}
          onChange={(value) => onChange("category", value, true)}
        />
        <button
          style={styles.deleteButton}
          onClick={onRemove}
          type="button"
          aria-label="Produkt entfernen"
        >
          <Trash2 size={16} strokeWidth={2} />
        </button>
      </div>

      <div style={styles.fieldGrid}>
        <Field
          label="Kaufdatum"
          value={product.kaufdatum}
          onChange={(v) => onChange("kaufdatum", v)}
        />
        <Field
          label="MHD"
          value={product.mhd}
          onChange={(v) => onChange("mhd", v)}
        />
        <Field
          label="Geöffnet am"
          value={product.oeffnungsdatum}
          onChange={(v) => onChange("oeffnungsdatum", v)}
        />
      </div>
    </li>
  );
}

function Field({ label, value, onChange, onBlur }) {
  return (
    <label style={styles.fieldLabel}>
      {label}
      <input
        style={styles.fieldInput}
        type="date"
        value={value}
        onChange={(e) => onChange(e.target.value)}
        onBlur={onBlur}
      />
    </label>
  );
}

function CategoryDropdown({ value, onChange }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  const current =
    CATEGORY_OPTIONS.find((o) => o.value === (value || "kuehlschrank")) ||
    CATEGORY_OPTIONS[0];

  useEffect(() => {
    if (!open) return;
    function handleOutside(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) {
        setOpen(false);
      }
    }
    document.addEventListener("mousedown", handleOutside);
    return () => document.removeEventListener("mousedown", handleOutside);
  }, [open]);

  return (
    <div style={styles.categoryDropdownWrap} ref={wrapRef}>
      <button
        type="button"
        style={styles.categoryDropdownButton}
        onClick={() => setOpen((o) => !o)}
        aria-label={`Kategorie: ${current.text}`}
        aria-expanded={open}
      >
        <span style={styles.categoryIcon}>{current.icon}</span>
        <ChevronDown
          size={13}
          strokeWidth={2.3}
          style={{
            opacity: 0.5,
            transform: open ? "rotate(180deg)" : "rotate(0deg)",
            transition: "transform 0.15s ease",
          }}
        />
      </button>
      {open && (
        <div style={styles.categoryMenu} role="listbox">
          {CATEGORY_OPTIONS.map((opt, i) => (
            <button
              key={opt.value}
              type="button"
              role="option"
              aria-selected={opt.value === current.value}
              style={{
                ...styles.categoryMenuItem,
                ...(i < CATEGORY_OPTIONS.length - 1
                  ? { borderBottom: "1px solid var(--border)" }
                  : {}),
                ...(opt.value === current.value
                  ? styles.categoryMenuItemActive
                  : {}),
              }}
              onClick={() => {
                onChange(opt.value);
                setOpen(false);
              }}
            >
              <span style={styles.categoryIcon}>{opt.icon}</span>
              {opt.text}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------- Einkaufsliste ---------- */

function ShoppingView({
  shopping,
  onBack,
  onAdd,
  onToggle,
  onRemove,
  onRename,
  onAddToFridge,
  newShopName,
  setNewShopName,
}) {
  const submit = () => {
    onAdd(newShopName);
  };

  const handlePrint = () => {
    const escapeHtml = (str) =>
      String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

    const openItems = shopping.filter((i) => !i.remembered);
    const doneItems = shopping.filter((i) => i.remembered);

    const openHtml = openItems.length
      ? openItems
          .map((i) => `<li>${escapeHtml(i.name)}</li>`)
          .join("")
      : "<li class=\"muted\">Keine offenen Artikel.</li>";

    const doneHtml = doneItems
      .map((i) => `<li class="done">${escapeHtml(i.name)}</li>`)
      .join("");

    const dateLabel = new Date().toLocaleDateString("de-DE", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
    });

    const printWindow = window.open("", "_blank", "width=420,height=640");
    if (!printWindow) return;

    printWindow.document.write(`
      <!DOCTYPE html>
      <html lang="de">
        <head>
          <meta charset="utf-8" />
          <title>Einkaufsliste – ${dateLabel}</title>
          <style>
            body {
              font-family: Georgia, "Times New Roman", serif;
              padding: 32px;
              color: #26221B;
            }
            h1 { font-size: 24px; margin: 0 0 4px; }
            .date { font-size: 13px; color: #7A7365; margin-bottom: 20px; }
            h2 {
              font-size: 15px;
              margin: 24px 0 8px;
              color: #7A7365;
              font-family: system-ui, sans-serif;
            }
            ul { padding-left: 20px; margin: 0; }
            li { font-size: 15px; margin-bottom: 7px; }
            li.done { color: #999; text-decoration: line-through; }
            li.muted { color: #999; font-style: italic; }
          </style>
        </head>
        <body>
          <h1>Einkaufsliste</h1>
          <div class="date">${dateLabel}</div>
          <ul>${openHtml}</ul>
          ${doneItems.length ? `<h2>Merkliste</h2><ul>${doneHtml}</ul>` : ""}
        </body>
      </html>
    `);
    printWindow.document.close();
    printWindow.focus();

    // Kurze Verzögerung, damit der Inhalt sicher gerendert ist,
    // bevor der native Druckdialog mit den installierten Druckern erscheint.
    let printed = false;
    const triggerPrint = () => {
      if (printed) return;
      printed = true;
      printWindow.print();
    };
    printWindow.onload = triggerPrint;
    setTimeout(triggerPrint, 300);
  };

  const handleWhatsApp = () => {
    const lines = shopping.map((item) => `• ${item.name}`);
    const text =
      lines.length > 0
        ? `Einkaufsliste:\n${lines.join("\n")}`
        : "Einkaufsliste ist leer.";
    const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
    window.open(url, "_blank", "noopener,noreferrer");
  };

  const openItems = shopping.filter((item) => !item.remembered);
  const doneItems = shopping.filter((item) => item.remembered);

  return (
    <div style={styles.page}>
      <div style={styles.topRow}>
        <Brand />
        <div style={styles.headerActions}>
          <button
            style={styles.iconButton}
            onClick={handlePrint}
            type="button"
            aria-label="Einkaufsliste drucken"
            title="Drucken"
          >
            <Printer size={17} strokeWidth={2.2} />
          </button>
          <button
            style={styles.iconButton}
            onClick={handleWhatsApp}
            type="button"
            aria-label="Einkaufsliste per WhatsApp teilen"
            title="Per WhatsApp teilen"
          >
            <Share2 size={17} strokeWidth={2.2} />
          </button>
        </div>
      </div>

      <h1 style={styles.shoppingTitle}>Einkaufsliste</h1>

      <div style={styles.shopForm}>
        <input
          style={styles.shopInput}
          type="text"
          placeholder="Artikel hinzufügen …"
          value={newShopName}
          onChange={(e) => setNewShopName(e.target.value)}
          onKeyDown={(e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              submit();
            }
          }}
        />
        <button
          style={styles.shopAddButton}
          type="button"
          onClick={submit}
          aria-label="Hinzufügen"
        >
          <Plus size={18} strokeWidth={2.4} />
        </button>
      </div>

      {openItems.length === 0 ? (
        <div style={styles.emptyState}>Die Einkaufsliste ist leer.</div>
      ) : (
        <ul style={styles.shopList}>
          {openItems.map((item) => (
            <ShoppingRow
              key={item.id}
              item={item}
              onToggle={onToggle}
              onRemove={onRemove}
              onRename={onRename}
              onAddToFridge={onAddToFridge}
            />
          ))}
        </ul>
      )}

      <h2 style={styles.merklisteTitle}>Merkliste</h2>
      {doneItems.length === 0 ? (
        <div style={styles.emptyState}>
          Noch nichts abgehakt.
        </div>
      ) : (
        <ul style={styles.shopList}>
          {doneItems.map((item) => (
            <ShoppingRow
              key={item.id}
              item={item}
              onToggle={onToggle}
              onRemove={onRemove}
              onRename={onRename}
              onAddToFridge={onAddToFridge}
            />
          ))}
        </ul>
      )}

      <div style={styles.bottomLeftRow}>
        <button style={styles.homeButton} onClick={onBack} type="button">
          <ArrowLeft size={16} strokeWidth={2.4} />
          Startseite
        </button>
      </div>
    </div>
  );
}

function ShoppingRow({ item, onToggle, onRemove, onRename, onAddToFridge }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(item.name);
  const inputRef = useRef(null);

  useEffect(() => {
    if (editing && inputRef.current) {
      inputRef.current.focus();
      inputRef.current.select();
    }
  }, [editing]);

  const startEdit = () => {
    setDraft(item.name);
    setEditing(true);
  };

  const commitEdit = () => {
    onRename(item.id, draft);
    setEditing(false);
  };

  const cancelEdit = () => {
    setDraft(item.name);
    setEditing(false);
  };

  return (
    <li style={styles.shopRow}>
      <button
        style={{
          ...styles.checkbox,
          ...(item.checked ? styles.checkboxChecked : {}),
        }}
        onClick={() => onToggle(item.id)}
        type="button"
        aria-label={item.checked ? "erledigt" : "offen"}
      >
        {item.checked && <Check size={13} strokeWidth={3} color="#fff" />}
      </button>

      {editing ? (
        <input
          ref={inputRef}
          style={styles.shopItemEditInput}
          type="text"
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          onBlur={commitEdit}
          onKeyDown={(e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              commitEdit();
            } else if (e.key === "Escape") {
              e.preventDefault();
              cancelEdit();
            }
          }}
        />
      ) : (
        <span
          style={{
            ...styles.shopItemText,
            ...(item.checked ? styles.shopItemTextChecked : {}),
          }}
        >
          {item.name}
        </span>
      )}

      <button
        style={styles.editButton}
        onClick={editing ? commitEdit : startEdit}
        type="button"
        aria-label={`${item.name} bearbeiten`}
        title="Bearbeiten"
      >
        <NotebookPen size={16} strokeWidth={2.1} />
      </button>
      <button
        style={styles.restoreButton}
        onClick={() => onAddToFridge(item.id, item.name)}
        type="button"
        aria-label={`${item.name} in die Produktliste eintragen`}
        title="In Produktliste eintragen"
      >
        <ListPlus size={16} strokeWidth={2.1} />
      </button>
      <button
        style={styles.deleteButton}
        onClick={() => onRemove(item.id)}
        type="button"
        aria-label="entfernen"
      >
        <Trash2 size={15} strokeWidth={2} />
      </button>
    </li>
  );
}
