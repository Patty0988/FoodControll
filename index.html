/* ---------- Speicher (localStorage statt Claude-Artefakt-Storage) ---------- */
const storage = {
  async get(key) {
    const value = window.localStorage.getItem(key);
    if (value === null) {
      throw new Error("Kein Wert für Schlüssel: " + key);
    }
    return { key, value };
  },
  async set(key, value) {
    window.localStorage.setItem(key, value);
    return { key, value };
  },
};

/* ---------- Hilfsfunktionen ---------- */

const todayISO = () => new Date().toISOString().slice(0, 10);

function daysSince(dateStr) {
  if (!dateStr) return null;
  const opened = new Date(dateStr + "T00:00:00");
  const now = new Date(todayISO() + "T00:00:00");
  const diffMs = now - opened;
  return Math.floor(diffMs / (1000 * 60 * 60 * 24));
}

function isMhdExpired(mhd) {
  if (!mhd) return false;
  const mhdDate = new Date(mhd + "T00:00:00");
  const today = new Date(todayISO() + "T00:00:00");
  return today > mhdDate;
}

// rot: MHD bereits überschritten (unabhängig vom Öffnungsdatum)
// grün: leer oder < 14 Tage seit Öffnung
// gelb: 14–20 Tage seit Öffnung
// rot: ab 21 Tage seit Öffnung
function urgencyColor(oeffnungsdatum, mhd) {
  if (isMhdExpired(mhd)) {
    return { color: "var(--dot-red)", label: "MHD überschritten!" };
  }
  const d = daysSince(oeffnungsdatum);
  if (d === null || d < 14) return { color: "var(--dot-green)", label: "frisch" };
  if (d < 21) return { color: "var(--dot-yellow)", label: "bald verbrauchen" };
  return { color: "var(--dot-red)", label: "verbrauchen!" };
}

// Sortierrang: rot (0) vor gelb (1) vor grün (2)
function urgencyRank(oeffnungsdatum, mhd) {
  const { color } = urgencyColor(oeffnungsdatum, mhd);
  if (color === "var(--dot-red)") return 0;
  if (color === "var(--dot-yellow)") return 1;
  return 2;
}

function sortByUrgency(items) {
  return [...items].sort(
    (a, b) =>
      urgencyRank(a.oeffnungsdatum, a.mhd) -
      urgencyRank(b.oeffnungsdatum, b.mhd)
  );
}

function formatDate(d) {
  if (!d) return "";
  const [y, m, day] = d.split("-");
  return `${day}.${m}.${y}`;
}

// Heutiges Datum in lokaler Zeit als yyyy-mm-dd
function localTodayISO() {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${mm}-${dd}`;
}

const SEL_MIN = 0.12; // kleinste erlaubte Kantenlänge der Auswahl (Anteil am Bild)
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

// Verschiebt oder vergrößert/verkleinert den Auswahlbereich.
// Alle Werte sind Anteile (0–1) der Bildbreite bzw. -höhe.
// mode: "move" oder eine Kante/Ecke: n, s, e, w, ne, nw, se, sw
function resizeSelection(orig, mode, dx, dy) {
  let { x, y, w, h } = orig;
  if (mode === "move") {
    x = clamp(x + dx, 0, 1 - w);
    y = clamp(y + dy, 0, 1 - h);
    return { x, y, w, h };
  }
  if (mode.includes("w")) {
    const nx = clamp(x + dx, 0, x + w - SEL_MIN);
    w = w + (x - nx);
    x = nx;
  }
  if (mode.includes("e")) {
    w = clamp(w + dx, SEL_MIN, 1 - x);
  }
  if (mode.includes("n")) {
    const ny = clamp(y + dy, 0, y + h - SEL_MIN);
    h = h + (y - ny);
    y = ny;
  }
  if (mode.includes("s")) {
    h = clamp(h + dy, SEL_MIN, 1 - y);
  }
  return { x, y, w, h };
}

// ---- Analyse einzelner Beleg-Zeilen ----
const RECEIPT_IGNORE_CONTAINS =
  /(summe|gesamt|total|zwischensumme|mwst|mw\.\s?st|\bust\b|steuer|netto|brutto|gegeben|rückgeld|rueckgeld|zahlung|girocard|kartenzahlung|mastercard|betrag|rabatt|\bpfand\b)/i;
const RECEIPT_IGNORE_EXACT = /^(bar|ec|ec-karte|karte|visa|eur|euro)$/i;
const RECEIPT_STOP_WORDS = new Set(["eur", "kg", "stk", "st", "x", "ea", "euro"]);
// Preis am Zeilenende, z. B. "1,09", "1,09 B", "1,09 EUR", "1,09 *"
const TRAILING_PRICE = /\s+-?\d{1,4}[.,]\d{2}\s*(?:€|EUR)?(?:\s*[A-E*])?\s*$/;
const LEADING_JUNK = /^[^A-Za-zÄÖÜäöüß0-9]+/;
const TRAILING_JUNK = /[^A-Za-zÄÖÜäöüß0-9%).]+$/;
const WORD_3_LETTERS = /[A-Za-zÄÖÜäöüß]{3,}/;

function capitalizeWord(w) {
  return w
    .split("-")
    .map((p) => (p ? p.charAt(0).toUpperCase() + p.slice(1).toLowerCase() : p))
    .join("-");
}

// Liefert den bereinigten Produktnamen einer Beleg-Zeile oder "" (keine Produktzeile)
function cleanReceiptLine(raw) {
  let s = String(raw || "")
    .replace(/[|¦_~]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
  if (!s) return "";

  // Gewichts-/Kilopreis-Zeilen (z. B. "0,812 kg x 2,29 EUR/kg") sind keine Produkte
  if (/^[\d.,]+\s*(?:kg|g)\b.*\s[x×]\s/i.test(s) || /\/\s*kg/i.test(s)) return "";

  while (TRAILING_PRICE.test(s)) s = s.replace(TRAILING_PRICE, "");
  s = s.replace(/^\d+\s*[x×]\s*/i, ""); // Menge am Anfang, z. B. "2 x "
  s = s.replace(/^\d{4,}\s+/, ""); // Artikelnummer am Anfang
  s = s.replace(LEADING_JUNK, "").replace(TRAILING_JUNK, "").trim();
  if (!s) return "";

  if (RECEIPT_IGNORE_CONTAINS.test(s) || RECEIPT_IGNORE_EXACT.test(s)) return "";

  const meaningful = s
    .split(" ")
    .filter((w) => WORD_3_LETTERS.test(w) && !RECEIPT_STOP_WORDS.has(w.toLowerCase()));
  if (meaningful.length === 0) return "";

  // Belege sind oft komplett in Großbuchstaben -> lesbarer machen
  if (!/[a-zäöüß]/.test(s)) {
    s = s
      .split(" ")
      .map((w) => (/\d/.test(w) ? w : capitalizeWord(w)))
      .join(" ");
  }
  return s;
}

// Analysiert den erkannten Text Zeile für Zeile und gibt die Produktnamen zurück
function parseReceiptLines(text) {
  return String(text || "")
    .split(/\r?\n/)
    .map(cleanReceiptLine)
    .filter(Boolean);
}

// Schneidet den gewählten Bereich aus und bereitet ihn für die Texterkennung vor
// (Größe anpassen, Graustufen, Kontrast strecken).
function cropAndPrepare(canvas, sel) {
  const sx = Math.round(sel.x * canvas.width);
  const sy = Math.round(sel.y * canvas.height);
  const sw = Math.max(1, Math.round(sel.w * canvas.width));
  const sh = Math.max(1, Math.round(sel.h * canvas.height));

  let scale = 1;
  if (sw < 1200) scale = Math.min(3, 1200 / sw);
  else if (sw > 2000) scale = 2000 / sw;

  const out = document.createElement("canvas");
  out.width = Math.max(1, Math.round(sw * scale));
  out.height = Math.max(1, Math.round(sh * scale));
  const ctx = out.getContext("2d", { willReadFrequently: true });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(canvas, sx, sy, sw, sh, 0, 0, out.width, out.height);

  const img = ctx.getImageData(0, 0, out.width, out.height);
  const d = img.data;
  const hist = new Array(256).fill(0);
  for (let i = 0; i < d.length; i += 4) {
    const g = Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]);
    d[i] = d[i + 1] = d[i + 2] = g;
    hist[g]++;
  }
  const total = out.width * out.height;
  let lo = 0;
  let hi = 255;
  let acc = 0;
  for (let i = 0; i < 256; i++) {
    acc += hist[i];
    if (acc >= total * 0.02) {
      lo = i;
      break;
    }
  }
  acc = 0;
  for (let i = 255; i >= 0; i--) {
    acc += hist[i];
    if (acc >= total * 0.02) {
      hi = i;
      break;
    }
  }
  // Kontrast nur strecken, wenn das Bild überhaupt Kontrast hat
  // (sonst würde z. B. leeres weißes Papier ins Schwarze kippen)
  if (hi - lo >= 20) {
    const range = hi - lo;
    for (let i = 0; i < d.length; i += 4) {
      const v = clamp(((d[i] - lo) * 255) / range, 0, 255);
      d[i] = d[i + 1] = d[i + 2] = v;
    }
  }
  ctx.putImageData(img, 0, 0);
  return out;
}

// Texterkennung (Tesseract.js) wird erst beim ersten Scan nachgeladen
const TESSERACT_SRC =
  "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
let tesseractPromise = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (!tesseractPromise) {
    tesseractPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = TESSERACT_SRC;
      s.async = true;
      s.onload = () =>
        window.Tesseract
          ? resolve(window.Tesseract)
          : reject(new Error("Die Texterkennung ist nicht verfügbar."));
      s.onerror = () => {
        tesseractPromise = null;
        reject(
          new Error(
            "Die Texterkennung konnte nicht geladen werden. Bitte Internetverbindung prüfen."
          )
        );
      };
      document.head.appendChild(s);
    });
  }
  return tesseractPromise;
}

    id: `s_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
    name,
    checked: false,
    remembered: false,

function FridgeApp() {
  const [view, setView] = useState("fridge"); // "fridge" | "shopping"
  const [products, setProducts] = useState([]);
  const [shopping, setShopping] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [newShopName, setNewShopName] = useState("");

  /* Laden beim Start */
  useEffect(() => {
    (async () => {
      try {
        const p = await storage.get(STORAGE_KEY_PRODUCTS);
        const parsed = p ? JSON.parse(p.value) : [newProduct()];
        setProducts(
          parsed.map((item) => ({
            category: "kuehlschrank",
            icon: "",
            nameCommitted: !!(item.name && item.name.trim()),
            ...item,
          }))
        );
      } catch {
        setProducts([newProduct()]);
      }
      try {
        const s = await storage.get(STORAGE_KEY_SHOPPING);
        const parsedShopping = s ? JSON.parse(s.value) : [];
        setShopping(
          parsedShopping.map((item) => ({
            remembered: item.checked === true,
            ...item,
            checked: false,
          }))
        );
      } catch {
        setShopping([]);
      }
      setLoaded(true);
    })();
  }, []);

  const updateProduct = (id, field, value, shouldSave = false) => {
    setProducts((prev) => {
      const next = prev.map((p) =>
        p.id === id ? { ...p, [field]: value } : p
      );
      if (shouldSave) {
        storage
          .set(STORAGE_KEY_PRODUCTS, JSON.stringify(next))
          .catch(() => {
            /* im Hintergrund fehlgeschlagen, Eingabe bleibt erhalten */
          });
      }
      return next;
    });
  };

  const addProduct = () => {
    setProducts((prev) => [...prev, newProduct()]);
  };

  const removeProduct = (id) => {
    const removed = products.find((p) => p.id === id);
    setProducts((prev) => prev.filter((p) => p.id !== id));
    if (removed && removed.name.trim()) {
      persistShopping([...shopping, newShoppingItem(removed.name.trim())]);
    }
  };

  const saveProducts = useCallback(async () => {
    try {
      await storage.set(STORAGE_KEY_PRODUCTS, JSON.stringify(products));
    } catch {
      /* im Hintergrund fehlgeschlagen, Eingabe bleibt sichtbar erhalten */
    }
  }, [products]);

  const persistShopping = async (next) => {
    setShopping(next);
    try {
      await storage.set(STORAGE_KEY_SHOPPING, JSON.stringify(next));
    } catch {
      /* still shown, just not persisted */
    }
  };

  const addShoppingItem = (name) => {
    const trimmed = name.trim();
    if (!trimmed) return;
    persistShopping([...shopping, newShoppingItem(trimmed)]);
    setNewShopName("");
  };

  const toggleShoppingItem = (id) => {
    persistShopping(
      shopping.map((s) => {
        if (s.id !== id) return s;
        if (!s.remembered) {
          // Von der Einkaufsliste abgehakt -> in die Merkliste verschieben,
          // Haken direkt wieder entfernen.
          return { ...s, remembered: true, checked: false };
        }
        // In der Merkliste angeklickt -> zurück in die offene Einkaufsliste.
        return { ...s, remembered: false, checked: false };
      })
    );
  };

  const removeShoppingItem = (id) => {
    persistShopping(shopping.filter((s) => s.id !== id));
  };

  const renameShoppingItem = (id, name) => {
    const trimmed = (name || "").trim();
    if (!trimmed) return;
    persistShopping(
      shopping.map((s) => (s.id === id ? { ...s, name: trimmed } : s))
    );
  };

  // Trägt jeden gescannten Produktnamen als eigenes Produkt ein (Kaufdatum = heute)
  const addScannedProducts = async (names) => {
    const clean = names.map((n) => (n || "").trim()).filter(Boolean);
    if (clean.length === 0) return;
    const today = localTodayISO();
    const created = clean.map((name) => ({
      ...newProduct(),
      name,
      kaufdatum: today,
      nameCommitted: true,
    }));
    const next = [...products, ...created];
    setProducts(next);
    try {
      await storage.set(STORAGE_KEY_PRODUCTS, JSON.stringify(next));
    } catch {
      /* im Hintergrund fehlgeschlagen, Eingabe bleibt sichtbar erhalten */
    }
  };

  const addToFridgeList = async (id, name) => {
    const trimmed = (name || "").trim();
    if (!trimmed) return;
    const nextProducts = [
      ...products,
      { ...newProduct(), name: trimmed, nameCommitted: true },
    ];
    setProducts(nextProducts);
    try {
      await storage.set(
        STORAGE_KEY_PRODUCTS,
        JSON.stringify(nextProducts)
      );
    } catch {
      /* im Hintergrund fehlgeschlagen, Eingabe bleibt sichtbar erhalten */
    }
    persistShopping(shopping.filter((s) => s.id !== id));
  };

  const saveAll = useCallback(async () => {
    try {
      await Promise.all([
        storage.set(STORAGE_KEY_PRODUCTS, JSON.stringify(products)),
        storage.set(STORAGE_KEY_SHOPPING, JSON.stringify(shopping)),
      ]);
    } catch {
      /* im Hintergrund fehlgeschlagen, Eingabe bleibt sichtbar erhalten */
    }
  }, [products, shopping]);

  const goToShopping = () => {
    saveAll();
    setView("shopping");
  };

  const goToFridge = () => {
    saveAll();
    setView("fridge");
  };

  if (!loaded) {
    return (
      <div style={styles.appShell}>
        <FontStyles />
        <div style={{ padding: "48px 24px", color: "var(--text-secondary)" }}>
          Kühlschrank wird geladen …
        </div>
      </div>
    );
  }

  return (
    <div style={styles.appShell}>
      <FontStyles />
      {view === "fridge" ? (
        <FridgeView
          products={products}
          updateProduct={updateProduct}
          addProduct={addProduct}
          removeProduct={removeProduct}
          onSave={saveProducts}
          onAddScanned={addScannedProducts}
          onGoShopping={goToShopping}
        />
      ) : (
        <ShoppingView
          shopping={shopping}
          onBack={goToFridge}
          onAdd={addShoppingItem}
          onToggle={toggleShoppingItem}
          onRemove={removeShoppingItem}
          onRename={renameShoppingItem}
          onAddToFridge={addToFridgeList}
          newShopName={newShopName}
          setNewShopName={setNewShopName}
        />
      )}

      <div style={styles.creditBadge}>
        <span style={styles.creditMadeBy}>made by</span>{" "}
        <span style={styles.creditName}>PATTY</span>
      </div>
    </div>
  );
}

const SEL_HANDLES = [
  { mode: "nw", left: "0%", top: "0%", cursor: "nwse-resize" },
  { mode: "n", left: "50%", top: "0%", cursor: "ns-resize" },
  { mode: "ne", left: "100%", top: "0%", cursor: "nesw-resize" },
  { mode: "e", left: "100%", top: "50%", cursor: "ew-resize" },
  { mode: "se", left: "100%", top: "100%", cursor: "nwse-resize" },
  { mode: "s", left: "50%", top: "100%", cursor: "ns-resize" },
  { mode: "sw", left: "0%", top: "100%", cursor: "nesw-resize" },
  { mode: "w", left: "0%", top: "50%", cursor: "ew-resize" },
];

// Verschiebbarer und beliebig vergrößerbarer Auswahlrahmen über Kamera-/Foto-Bild.
// Außerhalb des Rahmens wird das Bild abgedunkelt.
function SelectionOverlay({ sel, onChange, containerRef }) {
  const dragRef = useRef(null);
  const pct = (v) => `${v * 100}%`;

  const startDrag = (mode) => (e) => {
    const container = containerRef.current;
    if (!container) return;
    e.preventDefault();
    e.stopPropagation();
    dragRef.current = {
      mode,
      startX: e.clientX,
      startY: e.clientY,
      orig: { ...sel },
      rect: container.getBoundingClientRect(),
    };
    try {
      e.currentTarget.setPointerCapture(e.pointerId);
    } catch {
      /* Pointer-Capture nicht verfügbar */
    }
  };

  const handleMove = (e) => {
    const d = dragRef.current;
    if (!d || d.rect.width === 0 || d.rect.height === 0) return;
    onChange(
      resizeSelection(
        d.orig,
        d.mode,
        (e.clientX - d.startX) / d.rect.width,
        (e.clientY - d.startY) / d.rect.height
      )
    );
  };

  const endDrag = () => {
    dragRef.current = null;
  };

  const right = sel.x + sel.w;
  const bottom = sel.y + sel.h;

  return (
    <>
      <div style={styles.selDimLayer} aria-hidden="true">
        <div style={{ ...styles.selDim, left: 0, top: 0, width: "100%", height: pct(sel.y) }} />
        <div style={{ ...styles.selDim, left: 0, top: pct(bottom), width: "100%", height: pct(1 - bottom) }} />
        <div style={{ ...styles.selDim, left: 0, top: pct(sel.y), width: pct(sel.x), height: pct(sel.h) }} />
        <div style={{ ...styles.selDim, left: pct(right), top: pct(sel.y), width: pct(1 - right), height: pct(sel.h) }} />
      </div>
      <div
        data-testid="selection-box"
        style={{
          ...styles.selBox,
          left: pct(sel.x),
          top: pct(sel.y),
          width: pct(sel.w),
          height: pct(sel.h),
        }}
        onPointerDown={startDrag("move")}
        onPointerMove={handleMove}
        onPointerUp={endDrag}
        onPointerCancel={endDrag}
      >
        {SEL_HANDLES.map((h) => (
          <div
            key={h.mode}
            data-handle={h.mode}
            onPointerDown={startDrag(h.mode)}
            style={{ ...styles.selHandle, left: h.left, top: h.top, cursor: h.cursor }}
          >
            <span style={styles.selHandleDot} />
          </div>
        ))}
      </div>
    </>
  );
}

// Vollbild-Fenster: Kamera -> Bereich wählen -> Analyse -> Produkte prüfen -> eintragen
function ReceiptScannerModal({ onClose, onAdd }) {
  const [phase, setPhase] = useState("camera"); // camera | review | analyzing | results
  const [cameraError, setCameraError] = useState("");
  const [videoSize, setVideoSize] = useState(null);
  const [frame, setFrame] = useState(null); // { url, w, h } des aufgenommenen Fotos
  const [sel, setSel] = useState({ x: 0.06, y: 0.2, w: 0.88, h: 0.55 });
  const [progress, setProgress] = useState({ label: "", value: 0 });
  const [items, setItems] = useState([]);
  const [rawText, setRawText] = useState("");
  const [error, setError] = useState("");

  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const containerRef = useRef(null);
  const frameCanvasRef = useRef(null);
  const fileInputRef = useRef(null);
  const runIdRef = useRef(0);

  const stopStream = () => {
    if (streamRef.current) {
      streamRef.current.getTracks().forEach((t) => t.stop());
      streamRef.current = null;
    }
  };

  // Beim Schließen: laufende Analyse verwerfen und Kamera freigeben
  useEffect(() => {
    return () => {
      runIdRef.current++;
      stopStream();
    };
  }, []);

  // Kamera des Geräts starten, solange die Kameraansicht aktiv ist
  useEffect(() => {
    if (phase !== "camera") return undefined;
    let cancelled = false;
    setCameraError("");
    setVideoSize(null);

    (async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setCameraError(
          "Die Kamera steht in diesem Browser nicht zur Verfügung (sie wird nur über eine sichere https-Adresse freigegeben). Du kannst stattdessen ein Foto aufnehmen oder auswählen."
        );
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
          },
          audio: false,
        });
        if (cancelled) {
          stream.getTracks().forEach((t) => t.stop());
          return;
        }
        streamRef.current = stream;
        const v = videoRef.current;
        if (v) {
          v.srcObject = stream;
          try {
            await v.play();
          } catch {
            /* Wiedergabe wird ggf. vom Browser verzögert gestartet */
          }
        }
      } catch (err) {
        if (cancelled) return;
        setCameraError(
          err && err.name === "NotAllowedError"
            ? "Der Zugriff auf die Kamera wurde nicht erlaubt. Bitte erlaube die Kamera in den Browser-Einstellungen oder wähle ein Foto aus."
            : "Die Kamera konnte nicht gestartet werden. Du kannst stattdessen ein Foto aufnehmen oder auswählen."
        );
      }
    })();

    return () => {
      cancelled = true;
      stopStream();
    };
  }, [phase]);

  const setFrameFromCanvas = (canvas) => {
    frameCanvasRef.current = canvas;
    setFrame({
      url: canvas.toDataURL("image/jpeg", 0.92),
      w: canvas.width,
      h: canvas.height,
    });
    setError("");
    setPhase("review");
  };

  // Standbild aus der Live-Kamera aufnehmen (volle Auflösung)
  const capture = () => {
    const v = videoRef.current;
    if (!v || !v.videoWidth) return;
    const canvas = document.createElement("canvas");
    canvas.width = v.videoWidth;
    canvas.height = v.videoHeight;
    canvas.getContext("2d").drawImage(v, 0, 0);
    setFrameFromCanvas(canvas);
  };

  // Alternative: Foto über die Kamera-App oder die Galerie wählen
  const handleFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      setFrameFromCanvas(canvas);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      setError("Das Bild konnte nicht gelesen werden.");
    };
    img.src = url;
  };

  // Nur den gewählten Bereich analysieren
  const analyze = async () => {
    const canvas = frameCanvasRef.current;
    if (!canvas) return;
    const runId = ++runIdRef.current;
    setError("");
    setProgress({ label: "Texterkennung wird vorbereitet …", value: 0 });
    setPhase("analyzing");
    let worker = null;
    try {
      const Tesseract = await loadTesseract();
      if (runId !== runIdRef.current) return;
      const prepared = cropAndPrepare(canvas, sel);
      worker = await Tesseract.createWorker("deu", 1, {
        logger: (m) => {
          if (runId !== runIdRef.current) return;
          if (m.status === "recognizing text") {
            setProgress({ label: "Text wird erkannt …", value: m.progress || 0 });
          } else {
            setProgress((p) => ({ label: "Texterkennung wird vorbereitet …", value: p.value }));
          }
        },
      });
      await worker.setParameters({
        tessedit_pageseg_mode: "6",
        preserve_interword_spaces: "1",
      });
      const { data } = await worker.recognize(prepared);
      if (runId !== runIdRef.current) return;
      const text = (data && data.text) || "";
      setRawText(text);
      setItems(
        parseReceiptLines(text).map((t, i) => ({ id: i, text: t, selected: true }))
      );
      setPhase("results");
    } catch (err) {
      if (runId !== runIdRef.current) return;
      setError(
        err && err.message
          ? `Die Analyse ist fehlgeschlagen: ${err.message}`
          : "Die Analyse ist fehlgeschlagen."
      );
      setPhase("review");
    } finally {
      if (worker) {
        try {
          await worker.terminate();
        } catch {
          /* Worker wurde bereits beendet */
        }
      }
    }
  };

  const cancelAnalysis = () => {
    runIdRef.current++;
    setPhase("review");
  };

  const toggleItem = (id) =>
    setItems((prev) =>
      prev.map((it) => (it.id === id ? { ...it, selected: !it.selected } : it))
    );
  const editItem = (id, text) =>
    setItems((prev) => prev.map((it) => (it.id === id ? { ...it, text } : it)));

  const chosen = items.filter((it) => it.selected && it.text.trim());
  const confirmAdd = () => {
    if (chosen.length === 0) return;
    onAdd(chosen.map((it) => it.text.trim()));
    onClose();
  };

  const size = phase === "camera" ? videoSize : frame ? { w: frame.w, h: frame.h } : null;
  const ratio = size ? size.w / size.h : 3 / 4;
  const showFrame = (phase === "camera" && !cameraError) || phase === "review";
  const titles = {
    camera: "Beleg fotografieren",
    review: "Bereich auswählen",
    analyzing: "Beleg wird analysiert",
    results: "Erkannte Produkte",
  };

  return (
    <div style={styles.scanOverlay} role="dialog" aria-modal="true" aria-label="Beleg scannen">
      <div style={styles.scanPanel}>
        <div style={styles.scanHeader}>
          <h2 style={styles.scanTitle}>{titles[phase]}</h2>
          <button type="button" style={styles.scanClose} onClick={onClose} aria-label="Schließen">
            <X size={18} strokeWidth={2.3} />
          </button>
        </div>

        <input
          ref={fileInputRef}
          type="file"
          accept="image/*"
          onChange={handleFile}
          style={{ display: "none" }}
          data-testid="receipt-file-input"
        />

        {(phase === "camera" || phase === "review") && (
          <>
            {phase === "camera" && cameraError && (
              <div style={styles.scanNotice}>{cameraError}</div>
            )}

            {showFrame && (
              <div
                ref={containerRef}
                style={{
                  ...styles.scanFrame,
                  aspectRatio: `${ratio}`,
                  maxWidth: `calc(60vh * ${ratio})`,
                }}
              >
                <div style={styles.scanMedia}>
                  {phase === "camera" ? (
                    <video
                      ref={videoRef}
                      playsInline
                      muted
                      autoPlay
                      style={styles.scanVideo}
                      onLoadedMetadata={(e) =>
                        setVideoSize({
                          w: e.target.videoWidth,
                          h: e.target.videoHeight,
                        })
                      }
                    />
                  ) : (
                    <img
                      src={frame.url}
                      alt="Aufgenommener Beleg"
                      draggable={false}
                      style={styles.scanVideo}
                    />
                  )}
                  {phase === "camera" && !videoSize && (
                    <div style={styles.scanLoading}>Kamera wird gestartet …</div>
                  )}
                </div>
                <SelectionOverlay sel={sel} onChange={setSel} containerRef={containerRef} />
              </div>
            )}

            <p style={styles.scanHint}>
              {phase === "camera"
                ? "Richte die Kamera auf den Beleg und ziehe den Rahmen über die Produktzeilen. Mit den Punkten an Ecken und Kanten kannst du den Bereich beliebig vergrößern oder verkleinern. Nur dieser Bereich wird analysiert."
                : "Passe den Rahmen bei Bedarf noch an. Nur der Bereich im Rahmen wird analysiert."}
            </p>

            {error && <div style={styles.scanError}>{error}</div>}

            <div style={styles.scanButtonRow}>
              {phase === "camera" && !cameraError && (
                <button
                  type="button"
                  style={{ ...styles.scanPrimary, ...(videoSize ? {} : styles.scanDisabled) }}
                  onClick={capture}
                  disabled={!videoSize}
                >
                  <Camera size={17} strokeWidth={2.3} />
                  Foto aufnehmen
                </button>
              )}
              {phase === "review" && (
                <button type="button" style={styles.scanPrimary} onClick={analyze}>
                  Auswahl analysieren
                </button>
              )}
              {phase === "review" && (
                <button type="button" style={styles.scanSecondary} onClick={() => setPhase("camera")}>
                  Neu aufnehmen
                </button>
              )}
              <button
                type="button"
                style={
                  phase === "camera" && cameraError ? styles.scanPrimary : styles.scanSecondary
                }
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
              >
                Foto wählen
              </button>
              {showFrame && (
                <button
                  type="button"
                  style={styles.scanSecondary}
                  onClick={() => setSel({ x: 0, y: 0, w: 1, h: 1 })}
                >
                  Ganzes Bild
                </button>
              )}
            </div>
          </>
        )}

        {phase === "analyzing" && (
          <div style={styles.scanProgressBox}>
            <p style={styles.scanProgressLabel}>
              {progress.label}
              {progress.value > 0 ? ` ${Math.round(progress.value * 100)} %` : ""}
            </p>
            <div style={styles.scanProgressTrack}>
              <div
                style={{
                  ...styles.scanProgressBar,
                  width: `${Math.round(progress.value * 100)}%`,
                }}
              />
            </div>
            <p style={styles.scanHint}>
              Beim ersten Mal wird die Texterkennung einmalig nachgeladen. Das kann einen Moment dauern.
            </p>
            <button type="button" style={styles.scanSecondary} onClick={cancelAnalysis}>
              Abbrechen
            </button>
          </div>
        )}

        {phase === "results" && (
          <>
            <p style={styles.scanHint}>
              {items.length > 0
                ? "Jede erkannte Zeile wird als eigenes Produkt eingetragen. Entferne den Haken bei Zeilen, die nicht übernommen werden sollen, und korrigiere Namen bei Bedarf."
                : "Es wurden keine Produktzeilen erkannt. Wähle den Bereich genauer oder fotografiere den Beleg näher und gerade von oben."}
            </p>

            {items.length > 0 && (
              <ul style={styles.scanItemList}>
                {items.map((it) => (
                  <li key={it.id} style={styles.scanItem}>
                    <button
                      type="button"
                      style={{
                        ...styles.checkbox,
                        ...(it.selected ? styles.checkboxChecked : {}),
                      }}
                      onClick={() => toggleItem(it.id)}
                      aria-label={it.selected ? "Nicht übernehmen" : "Übernehmen"}
                    >
                      {it.selected && <Check size={13} strokeWidth={3} color="#fff" />}
                    </button>
                    <input
                      style={styles.scanItemInput}
                      value={it.text}
                      onChange={(e) => editItem(it.id, e.target.value)}
                      aria-label="Produktname"
                    />
                  </li>
                ))}
              </ul>
            )}

            {items.length === 0 && rawText.trim() && (
              <details>
                <summary style={styles.scanHint}>Erkannten Rohtext anzeigen</summary>
                <pre style={styles.scanRaw}>{rawText}</pre>
              </details>
            )}

            <div style={styles.scanButtonRow}>
              {items.length > 0 && (
                <button
                  type="button"
                  style={{ ...styles.scanPrimary, ...(chosen.length ? {} : styles.scanDisabled) }}
                  onClick={confirmAdd}
                  disabled={chosen.length === 0}
                >
                  {chosen.length} {chosen.length === 1 ? "Produkt" : "Produkte"} hinzufügen
                </button>
              )}
              <button type="button" style={styles.scanSecondary} onClick={() => setPhase("review")}>
                Zurück zur Auswahl
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function ProductRow({ product, onChange, onRemove, onSave }) {
  const { color, label } = urgencyColor(product.oeffnungsdatum, product.mhd);

  const handleRowBlur = (e) => {
    // Nur reagieren, wenn der Fokus den gesamten Produktblock verlässt
    // (nicht bei einem Wechsel zwischen Feldern innerhalb derselben Zeile).
    if (e.currentTarget.contains(e.relatedTarget)) return;

    if (!product.nameCommitted && product.name.trim()) {
      onChange("nameCommitted", true, true);
    } else {
      onSave && onSave();
    }

  return (
    <li style={styles.row} onBlur={handleRowBlur}>
      <div style={styles.rowTop}>

          title={label}

          value={product.category}

function CategoryDropdown({ value, iconValue, onChange }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  const current =
    CATEGORY_OPTIONS.find((o) => o.value === (value || "kuehlschrank")) ||
    CATEGORY_OPTIONS[0];
  const currentIcon = iconValue || current.icon;

  useEffect(() => {
    if (!open) return;
    function handleOutside(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) {
        setOpen(false);
      }
    }
    document.addEventListener("mousedown", handleOutside);
    return () => document.removeEventListener("mousedown", handleOutside);
  }, [open]);

  return (
    <div style={styles.categoryDropdownWrap} ref={wrapRef}>
      <button
        type="button"
        style={styles.categoryDropdownButton}
        onClick={() => setOpen((o) => !o)}
        aria-label={`Kategorie: ${current.text}`}
        aria-expanded={open}
      >
        <span style={styles.categoryIcon}>{currentIcon}</span>
        <ChevronDown
          size={13}
          strokeWidth={2.3}
          style={{
            opacity: 0.5,
            transform: open ? "rotate(180deg)" : "rotate(0deg)",
            transition: "transform 0.15s ease",
          }}
        />
      </button>
      {open && (
        <div style={styles.categoryMenu} role="listbox">
          {CATEGORY_OPTIONS.map((opt, i) => (
            <div
              key={opt.value}
              style={{
                ...styles.categoryMenuItem,
                ...(i < CATEGORY_OPTIONS.length - 1
                  ? { borderBottom: "1px solid var(--border)" }
                  : {}),
                ...(opt.value === current.value
                  ? styles.categoryMenuItemActive
                  : {}),
              }}
            >
              <span style={styles.categoryMenuLabel}>{opt.text}</span>
              <div style={styles.categoryEmojiRow}>
                {opt.icons.map((emoji) => (
                  <button
                    key={emoji}
                    type="button"
                    role="option"
                    aria-selected={
                      opt.value === current.value && emoji === currentIcon
                    }
                    title={opt.text}
                    style={{
                      ...styles.categoryEmojiButton,
                      ...(opt.value === current.value && emoji === currentIcon
                        ? styles.categoryEmojiButtonActive
                        : {}),
                    }}
                    onClick={() => {
                      onChange(opt.value, emoji);
                      setOpen(false);
                    }}
                  >
                    {emoji}
                  </button>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------- Einkaufsliste ---------- */

function ShoppingView({
  shopping,
  onBack,
  onAdd,
  onToggle,
  onRemove,
  onRename,
  onAddToFridge,
  newShopName,
  setNewShopName,
}) {
  const submit = () => {
    onAdd(newShopName);
  };

  const handlePrint = () => {
    const escapeHtml = (str) =>
      String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

    const openItems = shopping.filter((i) => !i.remembered);
    const doneItems = shopping.filter((i) => i.remembered);

    const openHtml = openItems.length
      ? openItems
          .map((i) => `<li>${escapeHtml(i.name)}</li>`)
          .join("")
      : "<li class=\"muted\">Keine offenen Artikel.</li>";

    const doneHtml = doneItems
      .map((i) => `<li class="done">${escapeHtml(i.name)}</li>`)
      .join("");

    const dateLabel = new Date().toLocaleDateString("de-DE", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
    });

    const printWindow = window.open("", "_blank", "width=420,height=640");
    if (!printWindow) return;

    printWindow.document.write(`
      <!DOCTYPE html>
      <html lang="de">
        <head>
          <meta charset="utf-8" />
          <title>Einkaufsliste – ${dateLabel}</title>
          <style>
            body {
              font-family: Georgia, "Times New Roman", serif;
              padding: 32px;
              color: #26221B;
            }
            h1 { font-size: 24px; margin: 0 0 4px; }
            .date { font-size: 13px; color: #7A7365; margin-bottom: 20px; }
            h2 {
              font-size: 15px;
              margin: 24px 0 8px;
              color: #7A7365;
              font-family: system-ui, sans-serif;
            }
            ul { padding-left: 20px; margin: 0; }
            li { font-size: 15px; margin-bottom: 7px; }
            li.done { color: #999; text-decoration: line-through; }
            li.muted { color: #999; font-style: italic; }
          </style>
        </head>
        <body>
          <h1>Einkaufsliste</h1>
          <div class="date">${dateLabel}</div>
          <ul>${openHtml}</ul>
          ${doneItems.length ? `<h2>Merkliste</h2><ul>${doneHtml}</ul>` : ""}
        </body>
      </html>
    `);
    printWindow.document.close();
    printWindow.focus();

    // Kurze Verzögerung, damit der Inhalt sicher gerendert ist,
    // bevor der native Druckdialog mit den installierten Druckern erscheint.
    let printed = false;
    const triggerPrint = () => {
      if (printed) return;
      printed = true;
      printWindow.print();
    };
    printWindow.onload = triggerPrint;
    setTimeout(triggerPrint, 300);
  };

  const handleWhatsApp = () => {
    const lines = shopping.map((item) => `• ${item.name}`);
    const text =
      lines.length > 0
        ? `Einkaufsliste:\n${lines.join("\n")}`
        : "Einkaufsliste ist leer.";
    const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
    window.open(url, "_blank", "noopener,noreferrer");
  };

  const openItems = shopping.filter((item) => !item.remembered);
  const doneItems = shopping.filter((item) => item.remembered);

  return (
    <div style={styles.page}>
      <div style={styles.topRow}>
        <Brand />
        <div style={styles.headerActions}>
          <button
            style={styles.iconButton}
            onClick={handlePrint}
            type="button"
            aria-label="Einkaufsliste drucken"
            title="Drucken"
          >
            <Printer size={17} strokeWidth={2.2} />
          </button>
          <button
            style={styles.iconButton}
            onClick={handleWhatsApp}
            type="button"
            aria-label="Einkaufsliste per WhatsApp teilen"
            title="Per WhatsApp teilen"
          >
            <Share2 size={17} strokeWidth={2.2} />
          </button>
        </div>
      </div>

      <h1 style={styles.shoppingTitle}>Einkaufsliste</h1>

      <div style={styles.shopForm}>
        <input
          style={styles.shopInput}
          type="text"
          placeholder="Artikel hinzufügen …"
          value={newShopName}
          onChange={(e) => setNewShopName(e.target.value)}
          onKeyDown={(e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              submit();
            }
          }}
        />
        <button
          style={styles.shopAddButton}
          type="button"
          onClick={submit}
          aria-label="Hinzufügen"
        >
          <Plus size={18} strokeWidth={2.4} />
        </button>
      </div>

      {openItems.length === 0 ? (
        <div style={styles.emptyState}>Die Einkaufsliste ist leer.</div>
      ) : (
        <ul style={styles.shopList}>
          {openItems.map((item) => (
            <ShoppingRow
              key={item.id}
              item={item}
              onToggle={onToggle}
              onRemove={onRemove}
              onRename={onRename}
              onAddToFridge={onAddToFridge}
            />
          ))}
        </ul>
      )}

      <h2 style={styles.merklisteTitle}>Merkliste</h2>
      {doneItems.length === 0 ? (
        <div style={styles.emptyState}>
          Noch nichts abgehakt.
        </div>
      ) : (
        <ul style={styles.shopList}>
          {doneItems.map((item) => (
            <ShoppingRow
              key={item.id}
              item={item}
              onToggle={onToggle}
              onRemove={onRemove}
              onRename={onRename}
              onAddToFridge={onAddToFridge}
            />
          ))}
        </ul>
      )}

      <div style={styles.bottomLeftRow}>
        <button style={styles.homeButton} onClick={onBack} type="button">
          <ArrowLeft size={16} strokeWidth={2.4} />
          Startseite
        </button>
      </div>
    </div>
  );
}

function ShoppingRow({ item, onToggle, onRemove, onRename, onAddToFridge }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(item.name);
  const inputRef = useRef(null);

  useEffect(() => {
    if (editing && inputRef.current) {
      inputRef.current.focus();
      inputRef.current.select();
    }
  }, [editing]);

  const startEdit = () => {
    setDraft(item.name);
    setEditing(true);
  };

  const commitEdit = () => {
    onRename(item.id, draft);
    setEditing(false);
  };

  const cancelEdit = () => {
    setDraft(item.name);
    setEditing(false);
  };

  return (
    <li style={styles.shopRow}>
      <button
        style={{
          ...styles.checkbox,
          ...(item.checked ? styles.checkboxChecked : {}),
        }}
        onClick={() => onToggle(item.id)}
        type="button"
        aria-label={item.checked ? "erledigt" : "offen"}
      >
        {item.checked && <Check size={13} strokeWidth={3} color="#fff" />}
      </button>

      {editing ? (
        <input
          ref={inputRef}
          style={styles.shopItemEditInput}
          type="text"
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          onBlur={commitEdit}
          onKeyDown={(e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              commitEdit();
            } else if (e.key === "Escape") {
              e.preventDefault();
              cancelEdit();
            }
          }}
        />
      ) : (
        <span
          style={{
            ...styles.shopItemText,
            ...(item.checked ? styles.shopItemTextChecked : {}),
          }}
        >
          {item.name}
        </span>
      )}

      <button
        style={styles.editButton}
        onClick={editing ? commitEdit : startEdit}
        type="button"
        aria-label={`${item.name} bearbeiten`}
        title="Bearbeiten"
      >
        <NotebookPen size={16} strokeWidth={2.1} />
      </button>
      <button
        style={styles.restoreButton}
        onClick={() => onAddToFridge(item.id, item.name)}
        type="button"
        aria-label={`${item.name} in die Produktliste eintragen`}
        title="In Produktliste eintragen"
      >
        <ListPlus size={16} strokeWidth={2.1} />
      </button>
      <button
        style={styles.deleteButton}
        onClick={() => onRemove(item.id)}
        type="button"
        aria-label="entfernen"
      >
        <Trash2 size={15} strokeWidth={2} />
      </button>
    </li>
  );
}
